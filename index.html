<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment Gateway</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: white; padding: 24px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; width: 100%; max-width: 350px; }
        .badge { background: #e6f4ea; color: #1e8e3e; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 50px; display: inline-block; margin-bottom: 12px; }
        h2 { margin: 0; color: #1a1a1a; font-size: 20px; font-weight: 700; }
        .merchant { color: #666; font-size: 13px; margin: 4px 0 16px 0; }
        .amount-card { background: #f8f9fa; border: 1px solid #eaeaea; padding: 14px; border-radius: 12px; margin-bottom: 16px; }
        .amount-title { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .amount { font-size: 28px; font-weight: 800; color: #0f62fe; margin-top: 2px; }
        .upi-container { background: #f0f4ff; border: 1px dashed #abc7ff; padding: 8px 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .upi-text { font-size: 13px; font-weight: 600; color: #0043ce; word-break: break-all; text-align: left; }
        .copy-btn { background: #0f62fe; color: white; border: none; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; margin-left: 8px; flex-shrink: 0; }
        .pay-btn { display: flex; justify-content: center; align-items: center; background-color: #24a148; color: white; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: 700; margin-bottom: 20px; font-size: 16px; box-shadow: 0 4px 12px rgba(36,161,72,0.25); }
        .qr-box { background: white; padding: 12px; border-radius: 12px; border: 1px solid #eee; display: inline-block; margin-bottom: 16px; }
        #qrcode img { margin: 0 auto; display: block; }
        .footer-text { font-size: 11px; color: #888; font-weight: 500; margin-bottom: 10px; }
        .app-logos { display: flex; justify-content: center; align-items: center; gap: 16px; border-top: 1px solid #f0f0f0; padding-top: 16px; }
        .app-logos img { height: 22px; width: auto; object-fit: contain; }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">✓ Verified Merchant</span>
        <h2>Secure Payment</h2>
        <p class="merchant">Payee: <strong id="display-name" style="color: #333;">--</strong></p>
        
        <div class="amount-card">
            <div class="amount-title">Payable Amount</div>
            <div class="amount">₹<span id="display-amount">0</span></div>
        </div>

        <div class="upi-container">
            <span class="upi-text" id="display-upi">--</span>
            <button class="copy-btn" onclick="copyUpi()">Copy</button>
        </div>

        <a id="pay-button" href="#" class="pay-btn">Pay via Any UPI App</a>

        <div class="qr-box">
            <div id="qrcode"></div>
        </div>

        <div class="footer-text">Supported Payment Apps</div>
        <div class="app-logos">
            <img src="https://img.icons8.com/color/96/google-pay.png" alt="GPay">
            <img src="https://img.icons8.com/color/96/phone-pe.png" alt="PhonePe">
            <img src="https://img.icons8.com/color/96/paytm.png" alt="Paytm">
            <img src="https://img.icons8.com/color/96/upi.png" alt="UPI">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const upi = urlParams.get('upi') || 'abhishekai37941@nyes';
        const name = urlParams.get('name') || 'Abhishek';
        const amount = urlParams.get('amount') || '5690';

        document.getElementById('display-amount').textContent = amount;
        document.getElementById('display-name').textContent = name;
        document.getElementById('display-upi').textContent = upi;

        const upiLink = `upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(name)}&am=${encodeURIComponent(amount)}&cu=INR`;

        document.getElementById('pay-button').href = upiLink;

        new QRCode(document.getElementById("qrcode"), {
            text: upiLink,
            width: 160,
            height: 160
        });

        function copyUpi() {
            navigator.clipboard.writeText(upi).then(() => {
                alert("UPI ID Copied Successfully!");
            }).catch(err => {
                console.error("Copy failed: ", err);
            });
        }
    </script>
</body>
</html>
