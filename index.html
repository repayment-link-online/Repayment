<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment Portal</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        h2 { margin: 0 0 5px 0; color: #333; font-size: 20px; }
        .merchant { color: #666; font-size: 13px; margin-bottom: 15px; }
        .amount-box { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .amount { font-size: 26px; font-weight: bold; color: #007bff; }
        .upi-box { background: #e7f1ff; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; color: #0561a3; font-size: 13px; word-break: break-all; }
        .copy-btn { background: #007bff; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 8px; flex-shrink: 0; }
        .pay-btn { display: block; background-color: #2da15f; color: white; padding: 12px 0; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 15px; width: 100%; font-size: 15px; }
        .app-logos { display: flex; justify-content: center; gap: 12px; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
        .app-logos img { width: 35px; height: 35px; border-radius: 50%; object-fit: contain; }
        #qrcode img { margin: 0 auto; display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Secure Payment</h2>
        <p class="merchant">Pay via UPI Gateway</p>
        
        <div class="amount-box">
            <span style="font-size: 12px; color: #777;">Payable Amount</span><br>
            <span class="amount">₹<span id="display-amount">0</span></span>
        </div>

        <div class="upi-box">
            <span id="display-upi">--</span>
            <button class="copy-btn" onclick="copyUpi()">Copy</button>
        </div>

        <a id="pay-button" href="#" class="pay-btn">Pay with Any UPI App</a>
        <div id="qrcode"></div>

        <div class="app-logos">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo-vector.svg" alt="UPI">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/PhonePe_logo.svg/1200px-PhonePe_logo.svg.png" alt="PhonePe">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Google_Pay_Logo.svg/1024px-Google_Pay_Logo.svg.png" alt="GPay">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Paytm_logo.svg/1200px-Paytm_logo.svg.png" alt="Paytm">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const upi = urlParams.get('upi') || 'abhishekai37941@nyes';
        const name = urlParams.get('name') || 'Abhishek';
        const amount = urlParams.get('amount') || '5690';

        document.getElementById('display-amount').textContent = amount;
        document.getElementById('display-upi').textContent = upi;

        const upiLink = `upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(name)}&am=${encodeURIComponent(amount)}&cu=INR`;

        document.getElementById('pay-button').href = upiLink;

        new QRCode(document.getElementById("qrcode"), {
            text: upiLink,
            width: 160,
            height: 160
        });

        function copyUpi() {
            navigator.clipboard.writeText(upi).then(() => {
                alert("UPI ID Copied!");
            }).catch(err => {
                console.error("Copy failed: ", err);
            });
        }
    </script>
</body>
</html>
